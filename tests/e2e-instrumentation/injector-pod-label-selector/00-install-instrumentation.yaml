apiVersion: instrumentation.opentelemetry.io/v2alpha1
kind: Instrumentation
metadata:
  name: injector-pod-label
spec:
  injector: "{{INJECTOR_IMG}}"
  rules:
    - name: frontend-only
      selector:
        podLabels:
          app: frontend
      config:
        env:
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-collector:4318
