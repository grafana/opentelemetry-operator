# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: injector-pod-label-selector
spec:
  concurrent: false
  steps:
    - name: step-00
      try:
        - apply:
            file: 00-install-instrumentation.yaml
      cleanup:
        - delete:
            ref:
              apiVersion: instrumentation.opentelemetry.io/v2alpha1
              kind: Instrumentation
              name: injector-pod-label
    - name: step-01
      try:
        - apply:
            file: 01-install-apps.yaml
        - assert:
            file: 01-assert.yaml
        - error:
            file: 01-error.yaml
      catch:
        - podLogs:
            selector: app=frontend
        - podLogs:
            selector: app=backend
