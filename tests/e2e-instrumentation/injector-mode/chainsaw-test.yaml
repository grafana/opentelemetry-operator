# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: injector-mode
spec:
  concurrent: false
  steps:
    - name: step-00
      try:
        - apply:
            file: 00-install-instrumentation.yaml
      cleanup:
        - delete:
            ref:
              apiVersion: instrumentation.opentelemetry.io/v2alpha1
              kind: Instrumentation
              name: injector-mode
    - name: step-01
      try:
        - apply:
            file: 01-install-app.yaml
        - assert:
            file: 01-assert.yaml
      catch:
        - podLogs:
            selector: app=my-app
    - name: Verify all three modes
      try:
        - script:
            timeout: 30s
            content: |
              #!/bin/bash
              set -e

              # 1. myapp: inherits defaults.mode=install
              MODE=$(kubectl get pod -n ${NAMESPACE} -l app=my-app \
                -o jsonpath='{.items[0].spec.containers[?(@.name=="myapp")].env[?(@.name=="OTEL_INJECTOR_MODE")].value}')
              if [ "$MODE" != "install" ]; then
                echo "FAIL: myapp OTEL_INJECTOR_MODE='$MODE', expected 'install'"
                exit 1
              fi
              echo "OK: myapp has OTEL_INJECTOR_MODE=install (inherited from defaults.mode)"

              # 2. sidecar: mode=skip — no injection at all
              SIDECAR_ENV=$(kubectl get pod -n ${NAMESPACE} -l app=my-app \
                -o jsonpath='{.items[0].spec.containers[?(@.name=="sidecar")].env[*].name}')
              if echo "$SIDECAR_ENV" | grep -q "LD_PRELOAD"; then
                echo "FAIL: sidecar has LD_PRELOAD but mode=skip should suppress injection"
                exit 1
              fi
              if echo "$SIDECAR_ENV" | grep -q "OTEL_INJECTOR_MODE"; then
                echo "FAIL: sidecar has OTEL_INJECTOR_MODE but mode=skip should suppress injection"
                exit 1
              fi
              echo "OK: sidecar correctly skipped (mode=skip overrides CR default)"

              # 3. conflict-container: explicit mode=install_unless_conflict
              CONFLICT_MODE=$(kubectl get pod -n ${NAMESPACE} -l app=my-app \
                -o jsonpath='{.items[0].spec.containers[?(@.name=="conflict-container")].env[?(@.name=="OTEL_INJECTOR_MODE")].value}')
              if [ "$CONFLICT_MODE" != "install_unless_conflict" ]; then
                echo "FAIL: conflict-container OTEL_INJECTOR_MODE='$CONFLICT_MODE', expected 'install_unless_conflict'"
                exit 1
              fi
              echo "OK: conflict-container has OTEL_INJECTOR_MODE=install_unless_conflict (explicit rule override)"

              echo "PASS: all three mode values verified"
