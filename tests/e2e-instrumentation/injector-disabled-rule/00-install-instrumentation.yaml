apiVersion: instrumentation.opentelemetry.io/v2alpha1
kind: Instrumentation
metadata:
  name: injector-disabled-rule
spec:
  injector: "{{INJECTOR_IMG}}"
  rules:
    - name: skip-sidecar
      selector:
        containerNames:
          - sidecar
      config:
        mode: skip
    - name: catch-all
      config:
        env:
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-collector:4318
