apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-app
spec:
  selector:
    matchLabels:
      app: crash-app
  replicas: 1
  template:
    metadata:
      labels:
        app: crash-app
    spec:
      containers:
        - name: myapp
          image: debian:bookworm-slim
          # Crash if LD_PRELOAD is set (simulates instrumentation-caused crash).
          # After rollback removes LD_PRELOAD, the container runs normally.
          command: ["sh", "-c", "if [ -n \"$LD_PRELOAD\" ]; then echo 'crash: LD_PRELOAD is set' >&2; exit 1; fi; echo 'running healthy' && sleep 3600"]
