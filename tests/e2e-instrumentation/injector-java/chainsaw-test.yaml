# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: injector-java
spec:
  concurrent: false
  steps:
  - name: step-00
    try:
    - apply:
        file: 00-install-collector.yaml
    - apply:
        file: 00-install-instrumentation.yaml
    cleanup:
      - delete:
          ref:
            apiVersion: instrumentation.opentelemetry.io/v2alpha1
            kind: Instrumentation
            name: injector-java
  - name: step-01
    try:
    - apply:
        file: 01-install-app.yaml
    - assert:
        file: 01-assert.yaml
    catch:
      - podLogs:
          selector: app=my-java
  - name: Verify resource attributes and service namespace
    try:
      - script:
          content: |
            #!/bin/bash
            set -eu
            ENV=$(kubectl get pod -n ${NAMESPACE} -l app=my-java -o jsonpath='{.items[0].spec.containers[0].env}')
            # OTEL_INJECTOR_SERVICE_NAMESPACE should equal the test namespace
            SVC_NS=$(echo "$ENV" | jq -r '.[] | select(.name == "OTEL_INJECTOR_SERVICE_NAMESPACE") | .value')
            if [ "$SVC_NS" != "$NAMESPACE" ]; then
              echo "FAIL: OTEL_INJECTOR_SERVICE_NAMESPACE='$SVC_NS', expected '$NAMESPACE'"
              exit 1
            fi
            # OTEL_INJECTOR_RESOURCE_ATTRIBUTES should contain key resource attributes
            RES_ATTRS=$(echo "$ENV" | jq -r '.[] | select(.name == "OTEL_INJECTOR_RESOURCE_ATTRIBUTES") | .value')
            for expected in "service.instance.id=" "k8s.node.name=" "k8s.deployment.name=my-java"; do
              if ! echo "$RES_ATTRS" | grep -q "$expected"; then
                echo "FAIL: OTEL_INJECTOR_RESOURCE_ATTRIBUTES missing '$expected'"
                echo "Got: $RES_ATTRS"
                exit 1
              fi
            done
            echo "PASS: resource attributes contain service.instance.id, k8s.node.name, k8s.deployment.name=my-java"
          timeout: 30s
  - name: Make a request to the app
    try:
      - command:
          entrypoint: kubectl
          args:
            - get
            - pod
            - -n
            - ${NAMESPACE}
            - -l
            - app=my-java
            - -o
            - jsonpath={.items[0].metadata.name}
          outputs:
          - name: podName
            value: ($stdout)
      - proxy:
          apiVersion: v1
          kind: Pod
          name: ($podName)
          namespace: ${NAMESPACE}
          port: "8080"
  - name: Wait for telemetry data
    try:
    - script:
        env:
          - name: LABEL_SELECTOR
            value: "app.kubernetes.io/name=deployment-collector"
          - name: CONTAINER_NAME
            value: "otc-container"
          - name: RETRY_TIMEOUT
            value: "120"
          - name: RETRY_SLEEP
            value: "5"
          - name: SEARCH_STRINGS_ENV
            value: |
              jvm.memory.used
              service.name: Str(my-java)
              service.namespace: Str(
              k8s.deployment.name: Str(my-java)
              k8s.replicaset.name: Str(my-java-
              k8s.namespace.name: Str(
              k8s.node.name: Str(
              k8s.pod.name: Str(
              k8s.pod.uid: Str(
              k8s.container.name: Str(myapp)
              service.instance.id: Str(
        timeout: 2m
        content: ../../test-e2e-apps/scripts/check_pod_logs.sh
  - name: Check the instrumented app has sent the telemetry data successfully
    try:
      - command:
          entrypoint: kubectl
          args:
            - get
            - pod
            - -n
            - ${NAMESPACE}
            - -l
            - app.kubernetes.io/name=deployment-collector
            - -o
            - jsonpath={.items[0].metadata.name}
          outputs:
          - name: podName
            value: ($stdout)
      - script:
          env:
          - name: podName
            value: ($podName)
          content: |
            #!/bin/bash
            # set -ex
            kubectl get --raw /api/v1/namespaces/$NAMESPACE/pods/${podName}:8888/proxy/metrics
          outputs:
          - name: metrics
            value: (x_metrics_decode($stdout))
          check:
            ($error == null): true
      - assert:
          resource:
            ($metrics[?as_string(metric."__name__") == 'otelcol_exporter_sent_spans_total'].value | [0] > `1`): true
            ($metrics[?as_string(metric."__name__") == 'otelcol_receiver_accepted_spans_total'].value | [0] > `1`): true
            ($metrics[?as_string(metric."__name__") == 'otelcol_exporter_sent_metric_points_total'].value | [0] > `1`): true
            ($metrics[?as_string(metric."__name__") == 'otelcol_receiver_accepted_metric_points_total'].value | [0] > `1`): true
    catch:
      - podLogs:
          selector: app=my-java
          container: otc-container
