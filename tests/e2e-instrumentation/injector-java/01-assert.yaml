apiVersion: v1
kind: Pod
metadata:
  labels:
    app: my-java
spec:
  containers:
    - name: myapp
      env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://deployment-collector:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_TRACES_SAMPLER
          value: always_on
        - name: OTEL_LOGS_EXPORTER
          value: none
        - name: OTEL_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OTEL_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: JVM_AUTO_INSTRUMENTATION_AGENT_PATH
          value: /otel-java/autoinstrumentation/javaagent.jar
        - name: LD_PRELOAD
          value: /otel/autoinstrumentation/libotelinject.so
        - name: OTEL_INJECTOR_CONFIG_FILE
          value: /otel/autoinstrumentation/injector/otelinject.conf
        - name: OTEL_INJECTOR_K8S_NAMESPACE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OTEL_INJECTOR_K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OTEL_INJECTOR_K8S_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: OTEL_INJECTOR_K8S_CONTAINER_NAME
          value: myapp
        - name: OTEL_INJECTOR_SERVICE_NAME
          value: my-java
        - name: OTEL_INJECTOR_SERVICE_NAMESPACE
        - name: OTEL_INJECTOR_RESOURCE_ATTRIBUTES
        - name: OTEL_INJECTOR_MODE
          value: install_unless_conflict
      volumeMounts:
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: otel-injector
          mountPath: /otel
          readOnly: true
        - name: otel-injector-java
          mountPath: /otel-java
          readOnly: true
status:
  containerStatuses:
    - name: myapp
      ready: true
      started: true
  phase: Running
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/managed-by: opentelemetry-operator
    app.kubernetes.io/name: deployment-collector
    app.kubernetes.io/part-of: opentelemetry
  name: deployment-collector
status:
  availableReplicas: 1
  readyReplicas: 1
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/managed-by: opentelemetry-operator
    app.kubernetes.io/name: deployment-collector
    app.kubernetes.io/part-of: opentelemetry
  name: deployment-collector
spec:
  ports:
  - appProtocol: grpc
    name: otlp-grpc
    port: 4317
    protocol: TCP
    targetPort: 4317
  - appProtocol: http
    name: otlp-http
    port: 4318
    protocol: TCP
    targetPort: 4318
