apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-device-plugin
  namespace: system
  labels:
    app.kubernetes.io/name: otel-device-plugin
    app.kubernetes.io/component: device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-device-plugin
        app.kubernetes.io/component: device-plugin
    spec:
      serviceAccountName: otel-device-plugin
      priorityClassName: system-node-critical
      initContainers:
        - name: init-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown 65532:65532 /var/otel/java"]
          volumeMounts:
            - name: otel-agents
              mountPath: /var/otel/java
          securityContext:
            runAsUser: 0
      containers:
        - name: device-plugin
          image: otel-device-plugin:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: device-plugin-socket
              mountPath: /var/lib/kubelet/device-plugins
            - name: otel-agents
              mountPath: /var/otel/java
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsUser: 0
            runAsGroup: 0
      volumes:
        - name: device-plugin-socket
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: otel-agents
          hostPath:
            path: /var/otel/java
            type: DirectoryOrCreate
      tolerations:
        - operator: Exists
          effect: NoSchedule
